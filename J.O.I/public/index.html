  <script>
    document.addEventListener('input', function (e) {
      if (e.target.classList.contains('tel-only')) {
        e.target.value = e.target.value.replace(/\D/g, '');
        if (window.JOIApp) {
          window.JOIApp.updateDraft(e.target.dataset.section, e.target.dataset.key, e.target.value);
        }
      }
      if (e.target.classList.contains('lrn-only')) {
        e.target.value = e.target.value.replace(/\D/g, '');
        if (window.JOIApp) {
          window.JOIApp.updateDraft(e.target.dataset.section, e.target.dataset.key, e.target.value);
        }
      }
      if (e.target.classList.contains('name-only')) {
        e.target.value = e.target.value.replace(/[^a-zA-ZÀ-ÿ\s-]/g, '');
        if (window.JOIApp) {
          window.JOIApp.updateDraft(e.target.dataset.section, e.target.dataset.key, e.target.value);
        }
      }
    });
  </script>

  <script src="app.js?v=3"></script>

  <script>
    window.JOIApp.toggleIntakePassword = function () {
      const el = document.getElementById('intake-password-input');
      if (!el) return;
      const show = el.dataset.show === 'true';
      el.type = show ? 'password' : 'text';
      el.dataset.show = String(!show);
      const btn = el.parentElement.querySelector('button');
      if (btn) btn.textContent = show ? '🙈' : '👁';
    };
  </script>
